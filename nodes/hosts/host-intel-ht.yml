# Пример второго типа машины (Intel + HT).
# Ping и pong на этой же машине, общий /dev/shm/ff-ping-pong.

cpu_vendor: intel
hyper_threading: true
ff_os_cores: [0]
ff_isolated_cores: [1]
ff_hw_concurrency: 2
ff_base_reboot: false

host_roles:
  - base
  - ping_pong

ff_services:
  - name: pong
    role: pong
    pin_slot: 0
  - name: ping
    role: ping
    pin_slot: 0
    frequency_us: 100
    statistic_wait_ms: 1000
    statistic_window_ms: 10000
    log_info_stat: true
